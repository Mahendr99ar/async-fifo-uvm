name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog and Verilator
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator

      - name: Lint RTL (Verilator -Wall)
        run: make lint

      - name: Directed self-checking test (Icarus)
        run: make directed
